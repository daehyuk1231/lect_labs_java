<html xmlns:th="http://www.thymeleaf.org/"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{/dept/default_layout}">

<div layout:fragment="content">
	<h1>부서목록</h1>
	[[ ${message} ]]
	<table border="1" class="table table-striped-columns">
		<thead>
			<tr>
				<th>부서번호</th>
				<th>부서명</th>
				<th>위치</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="dept: ${deptList}">
				<td th:text="${dept.deptNo}"></td>
				<td><a th:href="@{/dept/list/{id}(id=${dept.deptNo},)}"
					th:text="${dept.dName}"></a></td>
				<td th:text="{dept.loc}"></td>
			</tr>
		</tbody>
	</table>

	<div>
		<form action="./insert" method="post" id="frmForm">
			<ul th:object="${dept}">
				<li><label>부서번호: <input type="number"
						th:field="*{deptNo}" min="0" max="100" step="10" required
						onkeydown="return false"></label></li>
				<li><label>부서명: <input type="text" th:field="*{dName}"
						maxlength="20" required></label></li>
				<li><label>위치: <input type="text" th:field="*{loc}"
						maxlength="20" required></label></li>
			</ul>

			<button type="submit" id="btnNew" class="btn btn-primary">
				<i class="bi bi-clipboard-check-fill"></i>신규등록
			</button>
			<button type="submit" id="btnUpdate" class="btn btn-warning">수정저장</button>
			<button type="submit" id="btnDelete" class="btn btn-danger">삭제</button>
			<button type="button" onclick="location.href='/dept/list'"
				class="btn btn-light">초기화</button>
		</form>
	</div>
</div>
<div layout:fragment="script">
	<script>
		$('#frmForm').on('submit', function(e) {
			const btn = event.submitter.id;
			console.log(btn);
			e.preventDefault();

			const url = {
				'btnNew' : '/dept/insert',
				'btnUpdate' : '/dept/update',
				'btnDelete' : '/dept/delete',
			};

			$(this).attr({
				'action' : url[btn]
			}).unbind('submit').submit();
		});
	</script>
</div>
</html>
